name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check relay URL secret
        env:
          VITE_RELAY_URL: ${{ secrets.VITE_RELAY_URL }}
        run: |
          if [ -z "$VITE_RELAY_URL" ]; then
            echo "::error::Repository secret VITE_RELAY_URL is missing or empty."
            echo "Set it under Settings → Secrets and variables → Actions (repo secret, not environment)."
            echo "Example: wss://versus-2048-relay.onrender.com"
            exit 1
          fi
          case "$VITE_RELAY_URL" in
            wss://*|ws://*) echo "VITE_RELAY_URL is set (scheme ok)" ;;
            *)
              echo "::error::VITE_RELAY_URL must start with wss:// or ws://"
              exit 1
              ;;
          esac

      - name: Build
        run: npm run build
        env:
          GITHUB_ACTIONS: true
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Must be a repository Action secret (not an Environment secret).
          # Example: wss://versus-2048-relay.onrender.com
          VITE_RELAY_URL: ${{ secrets.VITE_RELAY_URL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
